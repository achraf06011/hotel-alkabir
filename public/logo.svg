<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer gold ring -->
  <circle cx="50" cy="50" r="49" fill="#D4AF37"/>
  <!-- Dark inner background -->
  <circle cx="50" cy="50" r="44" fill="#111111"/>
  <!-- Thin inner ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#D4AF37" stroke-width="0.6"/>

  <!-- Moroccan horseshoe arch -->
  <path d="M31 67 L31 43 Q31 17 50 17 Q69 17 69 43 L69 67 Z"
    fill="#D4AF37" fill-opacity="0.07" stroke="#D4AF37" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Small ornament top of arch -->
  <circle cx="50" cy="17" r="2" fill="#D4AF37"/>

  <!-- AK monogram -->
  <text x="50" y="57"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="23"
    font-weight="bold"
    text-anchor="middle"
    fill="#D4AF37">AK</text>

  <!-- Three stars -->
  <text x="50" y="82"
    font-family="Georgia, serif"
    font-size="10"
    letter-spacing="5"
    text-anchor="middle"
    fill="#D4AF37">&#9733;&#9733;&#9733;</text>
</svg>
